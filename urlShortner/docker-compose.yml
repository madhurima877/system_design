version: '3.9'
services:
  postgres:
    image: postgres:17
    container_name: url-shortner-postgres
    environment:
       POSTGRES_USER: admin
       POSTGRES_PASSWORD: admin
       POSTGRES_DB: url_shortner
    ports:
      - "15430:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data
  redis:
    image: redis:7
    container_name: url-shortner-redis
    ports:
      - "16380:6379"
volumes:
  postgres_data: