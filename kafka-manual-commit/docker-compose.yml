version: "3.9"

services:
  kafka-manual-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kafka-manual-zookeeper
    ports:
      - "32181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-manual:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-manual
    depends_on:
      - kafka-manual-zookeeper
    ports:
      - "39092:9092"
      - "39093:29092"
    environment:
      KAFKA_BROKER_ID: 2

      KAFKA_ZOOKEEPER_CONNECT: kafka-manual-zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-manual:29092,PLAINTEXT_HOST://localhost:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1